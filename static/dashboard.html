<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritratto — Staff</title>
    <link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Ritratto · Staff</div><div id="who"></div></header>
<main>
  <section class="card">
    <h2>New portrait</h2>
    <input type="file" id="photo" accept="image/*">
    <img id="thumb" class="thumb" alt="">
    <h3>Attire</h3>
    <div class="attire-grid" id="attireGrid"></div>
    <div id="suitUploadWrap" style="display:none">
      <input type="file" id="suitPhoto" accept="image/*">
    </div>
    <h3>Style</h3>
    <label class="radio"><input type="radio" name="style" value="photo" checked> Photographic portrait</label>
    <label class="radio"><input type="radio" name="style" value="painting"> Hand-painted look</label>
    <label class="radio"><input type="radio" name="style" value="refine"> Photo refinement — restore & clean up</label>
    <button id="genBtn">Generate</button>
    <div id="status" class="status"></div>
  </section>
  <section class="card">
    <h2>Jobs</h2>
    <div id="jobs"></div>
  </section>
</main>
<script src="dashboard.js"></script>
</body>
</html>
